name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve GitHub Pages base
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          owner_name="${REPOSITORY%%/*}"
          repository_name="${REPOSITORY#*/}"
          if [[ "${repository_name,,}" == "${owner_name,,}.github.io" ]]; then
            echo "DOCS_BASE=/" >> "$GITHUB_ENV"
          else
            echo "DOCS_BASE=/$repository_name/" >> "$GITHUB_ENV"
          fi
      - run: pnpm docs:build
      - run: touch apps/docs/.vitepress/dist/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: apps/docs/.vitepress/dist
